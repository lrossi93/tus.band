<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    var supported = ['en', 'it'];
    var lang = (navigator.language || navigator.userLanguage || 'en').slice(0,2);
    if (supported.indexOf(lang) === -1) lang = 'en';
    window.location.replace('/' + lang + '/' + window.location.search + window.location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=/en/">
</head>
<body></body>
</html>
